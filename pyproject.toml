[project]
name = "when-free"
version = "0.4.1"
description = "Which days and times am I free? Reads your calendar feeds and a pasted message, and prints the slots you can offer. Runs on your own machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Bichel" }]
requires-python = ">=3.11"
keywords = ["calendar", "icalendar", "ics", "availability", "free-busy", "scheduling", "interview", "google-calendar", "cli", "mcp", "mcp-server", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Scheduling",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []            # the standard library is enough, on purpose

[project.scripts]
whenfree = "whenfree.cli:main"
when-free = "whenfree.cli:main"      # so that `uvx when-free mcp` works without --from

[project.urls]
Homepage = "https://github.com/YauhenBichel/when-free"
Issues = "https://github.com/YauhenBichel/when-free/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whenfree"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "server.json", "packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

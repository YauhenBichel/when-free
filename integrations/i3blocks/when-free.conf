# i3blocks (and i3status-rust's custom block, sway's i3blocks): full text, short text, colour.
[when-free]
command=whenfree now --format i3blocks
interval=60

# Polybar instead:
# [module/when-free]
# type = custom/script
# exec = whenfree now --format polybar
# interval = 60

# tmux status line instead (in ~/.tmux.conf):
# set -g status-right '#(whenfree now --format tmux)'
# set -g status-interval 60
